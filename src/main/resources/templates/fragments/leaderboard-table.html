<div class="overflow-x-auto rounded-lg border border-gray-200 shadow-md m-5">
    <table class="w-full border-collapse bg-white text-left text-sm text-gray-500" th:fragment="leaderboard">
        <thead class="bg-gray-50">
        <tr>
            <th scope="col" class="px-6 py-4 font-medium text-gray-900">Rank</th>
            <th scope="col" class="px-6 py-4 font-medium text-gray-900">User</th>
            <th scope="col" class="px-6 py-4 font-medium text-gray-900">Portfolio Value</th>
            <th scope="col" class="px-6 py-4 font-medium text-gray-900">Loss</th>
            <th scope="col" class="px-6 py-4 font-medium text-gray-900">Percentage Loss</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 border-t border-gray-100">
        <tr th:each="user, iterStat : ${topUsers}" class="hover:bg-gray-50 transition-colors">

            <td class="px-6 py-4 font-bold"
                th:classappend="${iterStat.count == 1 ? 'text-yellow-500' : (iterStat.count == 2 ? 'text-gray-400' : (iterStat.count == 3 ? 'text-amber-600' : 'text-gray-600'))}"
                th:text="${iterStat.count}">
            </td>

            <td class="px-6 py-4 font-medium text-gray-900" th:text="${user.username}"></td>

            <td class="px-6 py-4" th:text="${#numbers.formatCurrency(user.portfolioValue)}"></td>

            <td class="px-6 py-4 text-red-600 font-medium" th:text="${#numbers.formatCurrency(user.loss)}"></td>

            <td class="px-6 py-4">
          <span class="inline-flex items-center gap-1 rounded-full bg-red-50 px-2 py-1 text-xs font-semibold text-red-600">
            <span th:text="${user.percentageLoss} + '%'"></span>
          </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
