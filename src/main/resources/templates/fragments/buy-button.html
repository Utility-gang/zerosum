<form
        th:fragment="buy-button (user.cash)"
        th:action="@{/stocks/{symbol}/buy(symbol=${company.symbol})}"
        method="post"
        class="mt-4 space-y-3">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
        <input type="range"
               th:min="${company.getCurrPrice()} / 4"
               th:max="${user.cash}"
               th:step="${company.getCurrPrice()} / 4"
               value="0"
               required
               name="money"
               th:id="|buy-selector-${company.symbol}|"
               orient="horizontal"
               class="w-full py-2 rounded-md accent-green-600">
        <p th:id="|buy-display-${company.symbol}|">
        <strong th:text="${#numbers.formatCurrency(company.getCurrPrice() / 4)}"></strong> (0.25 stocks)
        </p>
        <script th:inline="javascript">
            document.getElementById("buy-selector-" + [[${company.symbol}]])
                .addEventListener("input", (e) => {
                    const formatter = new Intl.NumberFormat(
                        "en-US",
                        { style: "currency", currency: "USD", }
                    );
                    const stockValue = formatter.format(e.currentTarget.value);
                    const numStocks = 0.01 *
                        Math.round(100 * e.currentTarget.value / [[${company.getCurrPrice()}]]);
                    document.getElementById("buy-display-" + [[${company.symbol}]])
                        .innerHTML = `<strong>${stockValue}</strong> (${numStocks} stocks est.)`;
                });
        </script>
    </div>

    <button th:if="${user.cash} >= (${company.getCurrPrice()}/4)" type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 shadow-sm hover:shadow-md">
        Buy Stock
    </button>

    <!--grey out buy button if there is no cash available-->
    <button th:unless="${user.cash} >= (${company.getCurrPrice()}/4)" disabled
            class="w-full bg-gray-300 text-white font-semibold py-2 px-4 rounded-md shadow-sm">
        Buy Stock
    </button>
</form>
