<form th:fragment="sell-button" th:action="@{/stocks/{symbol}/sell(symbol=${company.symbol})}" method="post" class="mt-4 space-y-3">
	<div>
		<label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
		<input type="number" name="amount" min="1" step="1" placeholder="1" th:if="${holdings?.getOrDefault(company.symbol, 0.0) ?: maxValue}" required class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 text-sm">
	</div>
	<button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 shadow-sm hover:shadow-md">
		Sell Stock
	</button>
</form>
