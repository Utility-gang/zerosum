<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<nav th:fragment="navbar" class="bg-gray-900 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <!-- Logo/Brand -->
            <div class="flex-shrink-0">
                <a href="/" class="text-2xl font-bold text-white hover:text-green-400 transition-colors duration-200">
                    ZeroSum
                </a>
            </div>

            <!-- Navigation Links -->
            <div class="hidden md:flex space-x-6">
                <a href="/" class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200">
                    Home
                </a>
                <a href="/portfolio" class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200">
                    Portfolio
                </a>
                <a href="/news" class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200">
                    News
                </a>
                <a href="/leaderboard" class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200">
                    Leaderboard
                </a>
                <a
                        th:unless="${isAuthenticated}"
                        class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
                        href="/oauth2/authorization/okta">
                    Login/Register
                </a>
                <a
                        th:if="${isAuthenticated}"
                        class="text-gray-300 hover:text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
                        href="/logout">
                    Logout
                </a>
            </div>

            <!-- Portfolio Value Badge -->
            <div th:if="${totalPortfolioValue != null}"
                 class="hidden md:flex items-center bg-gray-800/50 backdrop-blur-md border border-gray-700 rounded-xl px-4 py-1.5 gap-4 shadow-inner">

                <div class="flex items-center gap-2.5">
                    <div class="p-1.5 bg-rose-500/10 rounded-lg">
                        <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path>
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] tracking-wider font-bold text-gray-400 leading-none">NET WORTH</span>
                        <span th:text="${totalPortfolioValue}" class="text-lg font-bold text-white tracking-tight">$0.00</span>
                    </div>
                </div>

                <div class="h-8 w-[1px] bg-gray-700"></div>

                <div class="flex flex-col">
                    <span class="text-[10px] tracking-wider font-bold text-gray-400 leading-none">AVAILABLE CASH</span>
                    <span th:text="${#numbers.formatCurrency(user.getCash())}" class="text-lg font-bold text-white tracking-tight">$0.00</span>
                </div>
            </div>


            <!-- Mobile menu button -->
            <div class="md:hidden">
                <button type="button"
                        class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover: bg-gray-800 focus: outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                        onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    <div class="md:hidden hidden" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-2 bg-gray-800">
            <a href="/" class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium">
                Home
            </a>
            <a href="/portfolio" class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium">
                Portfolio
            </a>
            <a href="/news" class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium">
                News
            </a>
            <a href="/leaderboard" class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium">
                Leaderboard
            </a>
            <a
                    th:unless="${isAuthenticated}"
                    class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium"
                    href="/oauth2/authorization/okta">
                Login/Register
            </a>
            <a
                    th:if="${isAuthenticated}"
                    class="text-gray-300 hover:text-white hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium"
                    href="/logout">
                Logout
            </a>

            <!-- Portfolio value for mobile -->
            <div th:if="${totalPortfolioValue != null}"
                 class="mt-3 mx-2 p-3 bg-gray-900/60 backdrop-blur-xl border border-gray-700 rounded-xl shadow-lg">

                <div class="flex items-center justify-between gap-2">

                    <div class="flex items-center gap-3 flex-1">
                        <div class="p-1.5 bg-rose-500/10 rounded-lg">
                            <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path>
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[12px] tracking-wider font-bold text-gray-400 leading-none">NET WORTH</span>
                            <span th:text="${totalPortfolioValue}" class="text-lg font-bold text-white mt-0.5">$0.00</span>
                        </div>
                    </div>

                    <div class="h-8 w-[1px] bg-gray-700/50"></div>

                    <div class="flex flex-col flex-1 pl-2">
                        <span class="text-[12px] tracking-wider font-bold text-gray-400 leading-none ml-2.5">AVAILABLE CASH</span>
                        <span th:text="${#numbers.formatCurrency(user.getCash())}" class="text-lg font-bold text-white mt-0.5 ml-2.5">$0.00</span>
                    </div>

                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
