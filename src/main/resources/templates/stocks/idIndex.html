<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title th:if="${company}" th:text="|ZeroSum - ${company.symbol} Profile|"></title>
		<title th:unless="${company}" th:text="|ZeroSum - Company Profile|"></title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
		<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
	</head>

	<body class="bg-gray-50 min-h-screen">
		<!-- Include navbar -->
		<div th:replace="~{fragments/navbar.html :: navbar}"></div>

		<!-- Main Content -->
		<div class="max-w-7xl mx-auto px-4 sm:px-6 lg: px-8 py-8">
			<!-- Hero Section -->
			<div th:if="${company}" class="mb-8">
				<h1 class="text-4xl font-bold text-gray-900 mb-2" th:text="|${company.symbol} Profile|"></h1>
				<p class="text-gray-600" th:text="|View the performance of ${company.symbol}|"></p>
			</div>
			<div th:unless="${company}" class="mb-8">
				<h1 class="text-4xl font-bold text-gray-900 mb-2" th:text="|Stock Profile|"></h1>
				<p class="text-gray-600" th:text="|View the performance of a specific Stock|"></p>
			</div>

			<div th:replace="~{fragments/flash.html :: flash}"></div>

            <div th:if="${company}" class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 overflow-auto">
                <div class="p-4 sm:p-6 flex flex-col items-center">
                    <!-- Chart Section -->
                    <div class="w-full sm:max-w-[50%] mx-auto" th:if="${pricesJson}" id="chart"></div>
                    <div class="w-full sm:max-w-[50%] mx-auto" th:if="${pricesJson}" id="live-chart"
                         th:attr="hx-get='/stocks/' + ${company.symbol} + '/live'"
                         hx-trigger="every 1s"
                         hx-swap="none"
                         hx-vals='js:{"since": lastTime}'></div>
            
                    <!-- Fallback Company Info -->
                    <img th:unless="${pricesJson}" th:src="${company.logo}" class="w-24 h-24 sm:w-32 sm:h-32 mx-auto mt-4">
                    <p th:unless="${pricesJson}" th:text="${company.symbol}" class="text-lg font-semibold mt-2"></p>
                    <p th:unless="${pricesJson}" th:text="${company.currPrice}" class="text-gray-600"></p>
            
                    <!-- Buy/Sell Buttons -->
                    <div class="mt-6 w-full sm:max-w-[50%] mx-auto grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="w-full">
                            <div th:replace="~{fragments/buy-button.html :: buy-button(${user.getCash()})}"></div>
                        </div>
                        <div class="w-full">
                            <div th:replace="~{fragments/sell-button.html :: sell-button}"></div>
                        </div>
                    </div>
                </div>
            </div>

			<!-- Empty State -->
			<div th:unless="${company}" class="text-center py-12">
				<svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-. 707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
				</svg>
				<h3 class="mt-2 text-sm font-medium text-gray-900">No stocks available</h3>
				<p class="mt-1 text-sm text-gray-500">Check back later for available stocks.</p>
			</div>
		</div>
		<script th:inline="javascript" th:if="${pricesJson}">
			let lastTime = /*[[${lastPrice}]]*/;
            let chartContainer = document.getElementById('chart');
            const chart = LightweightCharts.createChart(document.getElementById('chart'), {width: chartContainer.clientWidth,height: 400,});
			const lineSeries = chart.addSeries(LightweightCharts.BaselineSeries, { baseValue: { type: 'price', price: /*[[${basePrice}]]*/ }, topLineColor: 'rgba( 38, 166, 154, 1)', topFillColor1: 'rgba( 38, 166, 154, 0.28)', topFillColor2: 'rgba( 38, 166, 154, 0.05)', bottomLineColor: 'rgba( 239, 83, 80, 1)', bottomFillColor1: 'rgba( 239, 83, 80, 0.05)', bottomFillColor2: 'rgba( 239, 83, 80, 0.28)' });
			const data = JSON.parse(/*[[${pricesJson}]]*/);
			lineSeries.setData(data);
			
            const now = Math.floor(Date.now() / 1000);
            chart.timeScale().setVisibleRange({
                from: now - 60,
                to: now,
            });
			
			document.body.addEventListener('htmx:afterRequest', function updateChart(event) {
				const newData = JSON.parse(event.detail.xhr.responseText);
				if (newData.length === 0) return;
				
				// append each new point
				newData.forEach(point => {
					console.log("point.time:", point.time, typeof point.time);
					lineSeries.update({
						time: Number(point.time),
						value: point.value
					});
						
                    lastTime = Number(point.time);
                    const now = Math.floor(Date.now() / 1000);
                    chart.timeScale().setVisibleRange({
                        from: now - 5 * 60,
                        to: now,
                    });
				});
			});
						
			document.body.addEventListener('htmx:configRequest', function updateChart(event) {
				event.detail.parameters.since = lastTime;
			});

            window.addEventListener('resize', () => {
                chartContainer = document.getElementById('chart');
                chart.resize(chartContainer.clientWidth, 400);
            });
		</script>
	</body>
</html>
