<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ZeroSum</title>
</head>
<body>

    <div th:each="company :${companies}">
        <div th:replace="~{fragments/stock.html :: stock(${company.logo}, ${company.symbol}, ${company.currPrice})}"></div>
        <div th:replace="~{fragments/buyButton.html :: buy(${company.symbol}, ${company.currPrice})}"></div>
    </div>

<script th:src="@{/main.js}"></script>
</body>
</html>
